# Every check a change must pass, on every supported system (FR-074, SC-014).
#
# The same commands are listed in CONTRIBUTING.md; a contributor can run all of them
# locally before opening a pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Show the toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # Documentation and readability are part of the build: an undocumented item, a
      # function over 50 lines, or one too tangled fails here.
      - name: Lints (default build)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lints (with the sample kinds and the test clock)
        run: cargo clippy --workspace --all-targets --features trcli-cli/test-clock,trcli-cli/sample-kind -- -D warnings

      - name: Documentation of every item, public and private
        run: cargo doc --workspace --no-deps --document-private-items

      # Unit tests, the contract suites against the fakes and against SQLite, the upgrade
      # tests, and the structural gates that need no feature: layering, help examples,
      # scenario coverage, the sample kinds staying external, atomic writes.
      - name: Tests (default build)
        run: cargo test --workspace

      # The acceptance scenarios against the built binary, the usage guides' examples,
      # the invalid-input gate, both output forms agreeing, and text in any script.
      - name: Behaviour scenarios and gates (with the sample kinds and the test clock)
        run: cargo test --workspace --features trcli-cli/test-clock,trcli-cli/sample-kind

      # A release build must not carry the sample kinds.
      - name: A default build has no sample commands
        shell: bash
        run: |
          cargo build -p trcli-cli
          help="$(cargo run -q -p trcli-cli -- --help)"
          if echo "$help" | grep -E 'specimen|sample-note'; then
            echo "the default build has a sample command" >&2
            exit 1
          fi

  performance:
    name: Timings (SC-012)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: A simple command under 100 ms; 10,000 records listed and searched under 2 s
        run: cargo test --release -p trcli-cli --test performance --features test-clock,sample-kind -- --ignored
