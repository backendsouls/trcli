# Builds one self-contained `trcli` binary per system and architecture (FR-062, SC-001)
# when a version tag is pushed, and attaches them to a draft release.
#
# These are default builds: without the sample record kinds and without the test clock.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v4

      - name: Install the target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p trcli-cli --target ${{ matrix.target }}

      - name: The release build has no sample commands
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/trcli"
          if "$binary" --help | grep -E 'specimen|sample-note'; then
            echo "the release build has a sample command" >&2
            exit 1
          fi
          "$binary" --version

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="trcli-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/trcli" README.md "$name/"
          cp -r docs/usage "$name/usage"
          tar -czf "$name.tar.gz" "$name"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "trcli-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/trcli.exe", "README.md" $name
          Copy-Item -Recurse "docs/usage" "$name/usage"
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: trcli-${{ matrix.target }}
          path: trcli-*.${{ matrix.archive }}

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create a draft release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --generate-notes trcli-*
