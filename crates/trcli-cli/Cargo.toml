[package]
name = "trcli-cli"
description = "TRCLI, The Research CLI: the trcli binary, its composition root, and its presentation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "trcli_cli"
path = "src/lib.rs"

[[bin]]
name = "trcli"
path = "src/main.rs"

# The black-box tests of the binary live at the repository root, beside the feature files
# they run. They belong to this package because it builds the binary they test.
[[test]]
name = "bdd"
path = "../../tests/bdd/main.rs"
harness = false
required-features = ["test-clock", "sample-kind"]

[[test]]
name = "usage"
path = "../../tests/usage.rs"
required-features = ["test-clock", "sample-kind"]

[[test]]
name = "help_examples"
path = "../../tests/help_examples.rs"

[[test]]
name = "layering"
path = "../../tests/layering.rs"

[[test]]
name = "scenario_coverage"
path = "../../tests/scenario_coverage.rs"

[[test]]
name = "invalid_input_gate"
path = "../../tests/invalid_input_gate.rs"
required-features = ["sample-kind"]

[[test]]
name = "sample_kind_is_external"
path = "../../tests/sample_kind_is_external.rs"

[[test]]
name = "forms_agree"
path = "../../tests/forms_agree.rs"
required-features = ["test-clock", "sample-kind"]

[[test]]
name = "any_script"
path = "../../tests/any_script.rs"
required-features = ["test-clock", "sample-kind"]

[[test]]
name = "offline"
path = "../../tests/offline.rs"

[[test]]
name = "no_half_written_files"
path = "../../tests/no_half_written_files.rs"

[[test]]
name = "read_only_workspace"
path = "../../tests/read_only_workspace.rs"

[[test]]
name = "performance"
path = "../../tests/performance.rs"
required-features = ["test-clock", "sample-kind"]

[features]
# Fixed clock and seeded identifiers taken from the environment. For BDD runs only.
test-clock = ["trcli-infra-system/test-clock"]
# The specimen and sample-note commands. For BDD runs only; never in a release.
sample-kind = ["trcli-application/sample-kind", "trcli-infra-sqlite/sample-kind"]

[dependencies]
trcli-domain.workspace = true
trcli-application.workspace = true
trcli-infra-sqlite.workspace = true
trcli-infra-system.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["local-offset"] }
unicode-width.workspace = true
terminal_size.workspace = true
anstyle.workspace = true

[dev-dependencies]
trcli-application = { workspace = true, features = ["test-support"] }
cucumber.workspace = true
assert_cmd.workspace = true
tempfile.workspace = true
sea-orm.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
