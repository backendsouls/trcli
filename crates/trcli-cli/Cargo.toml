[package]
name = "trcli-cli"
description = "TRCLI, The Research CLI: the trcli binary, its composition root, and its presentation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trcli"
path = "src/main.rs"

[features]
# Fixed clock and seeded identifiers taken from the environment. For BDD runs only.
test-clock = ["trcli-infra-system/test-clock"]
# The specimen and sample-note commands. For BDD runs only; never in a release.
sample-kind = ["trcli-application/sample-kind", "trcli-infra-sqlite/sample-kind"]

[dependencies]
trcli-domain.workspace = true
trcli-application.workspace = true
trcli-infra-sqlite.workspace = true
trcli-infra-system.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
unicode-width.workspace = true
terminal_size.workspace = true
anstream.workspace = true
anstyle.workspace = true

[dev-dependencies]
trcli-application = { workspace = true, features = ["test-support"] }
cucumber.workspace = true
assert_cmd.workspace = true
trycmd.workspace = true
tempfile.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
