[package]
name = "trcli-infra-sqlite"
description = "TRCLI storage adapter: SeaORM entities, migrations, and the ports implemented on SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Tables and stores of the sample record kinds. Never enabled in a release.
sample-kind = ["trcli-application/sample-kind"]

[dependencies]
trcli-domain.workspace = true
trcli-application.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
sha2.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
trcli-application = { workspace = true, features = ["test-support", "sample-kind"] }
trcli-infra-sqlite = { path = ".", features = ["sample-kind"] }
tokio.workspace = true
tempfile.workspace = true

[lints]
workspace = true
